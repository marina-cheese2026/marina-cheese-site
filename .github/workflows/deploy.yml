name: Deploy to Beget

# Автодеплой сайта на хостинг Beget при каждом пуше в master.
# Пароль и логин от FTP нигде в коде не хранятся — берутся из GitHub Secrets
# (Settings → Secrets and variables → Actions в репозитории на github.com).

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Токен бота @moskazka_bot и chat_id Марины для order.php — тоже из Secrets
      - name: Create tg-config.php
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          printf '<?php\n$TG_BOT_TOKEN = %s;\n$TG_CHAT_ID = %s;\n' \
            "$(php -r 'echo var_export(getenv("TG_BOT_TOKEN"), true);')" \
            "$(php -r 'echo var_export(getenv("TG_CHAT_ID"), true);')" > tg-config.php

      - name: Deploy by FTP to Beget
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
